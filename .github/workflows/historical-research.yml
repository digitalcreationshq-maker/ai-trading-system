name: historical-research

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  historical-backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install backend
        run: python -m pip install -e "./backend[test]"
      - name: Download real historical data
        run: |
          mkdir -p research-data
          for symbol in eurusd gbpusd usdjpy usdchf audusd nzdusd usdcad xauusd; do
            echo "Downloading $symbol H1 history..."
            npx --yes dukascopy-node -i "$symbol" -from 2018-01-01 -to 2026-10-01 -t h1 -f csv -dir research-data --batch-size 10 --batch-pause 1000
          done
      - name: Run quality checks, baseline backtests and Monte Carlo
        env:
          PYTHONPATH: backend
        run: python -m app.backtest.run_research research-data
      - name: Upload historical research evidence
        uses: actions/upload-artifact@v4
        with:
          name: phase-4-historical-research
          path: |
            research-data/*.csv
            research-report.json
          retention-days: 14
